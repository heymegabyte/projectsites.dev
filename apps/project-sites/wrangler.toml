# AppRuntimeContainer is new — register it under the SQLite storage backend
# in a fresh migration tag. Existing classes (SiteBuilder/TraceHub/ActivityHub)
# stay on their current backend per the legacy notes above.
#
# 2026-05-24 — `v_app_runtime` was applied in a prior deploy (RECS.md
# DO namespace `f212ddec402b406cb02a68b370bea5e0`). Re-applying the same
# tag in this slot returns CF API error 10074
# ("class already depended on by existing Durable Objects") because the
# remote worker's migration history doesn't include this tag. Comment
# out — the class continues to be served from the live deploy, no
# functional change.
# [[env.production.migrations]]
# tag = "v_app_runtime"
# new_sqlite_classes = ["AppRuntimeContainer"]

# Per-image AppRuntime subclasses — separate migration tag so the apply is
# idempotent and the rollout is auditable. All ten land in one transaction
# (matches the wrangler.toml block order above + the subclass file).
#
# Commented out 2026-05-24 — blocked on image-registry provisioning.
# [[env.production.migrations]]
# tag = "v_app_subclasses"
# new_sqlite_classes = [
#   "UmamiContainer",
#   "OutlineContainer",
#   "N8nContainer",
#   "VaultwardenContainer",
#   "UptimeKumaContainer",
#   "NocodbContainer",
#   "ListmonkContainer",
#   "MemosContainer",
#   "PocketbaseContainer",
#   "OpenWebuiContainer",
# ]

# Durable Object migrations (item #61). SiteBuilderContainer stays on the
# non-SQLite (classic) storage backend because it runs container instances
# rather than querying. TraceHub + ActivityHub move to the SQLite backend
# (GA April 2025, paid since Jan 2026) so they can use this.ctx.storage.sql.
# [[env.production.migrations]] block intentionally omitted.

# ─── Native Rate Limiting (production) ───────────────────────
# env configs do NOT inherit top-level bindings, so the ratelimit binding
# must be declared explicitly here as well. Identical fields to the
# top-level [[unsafe.bindings]] block above.
[[env.production.unsafe.bindings]]
name = "OAUTH_RATELIMIT"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 15, period = 10 }

# Stage 4.2 — per-IP Functions dispatch rate-limit (production). env configs do
# NOT inherit top-level bindings, so it is re-declared here identically.
[[env.production.unsafe.bindings]]
name = "FUNCTIONS_RATELIMIT"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 100, period = 60 }

# Pulse Inbox — REMOVED from UI/code 2026-05-25. Class kept as a 410-stub
# at `src/durable_objects/conversation_hub.ts` so the existing
# v_conversation_hub migration tag stays consistent. To hard-delete later:
# (1) confirm no live DO instances need data, (2) ship a separate deploy
# with `deleted_classes = ["ConversationHub"]` migration tag, (3) delete
# the stub file + binding below.
# [[env.production.migrations]]
# tag = "v_conversation_hub"
# new_sqlite_classes = ["ConversationHub"]
# TraceHub + ActivityHub + SiteBuilderContainer were already deployed under
# the legacy classic-Durable-Object storage backend in a prior `wrangler
# deploy`. Cloudflare's 10074 error blocks in-place class migrations once
# DOs depend on them. Two paths forward:
#   1. Rename the classes to `TraceHubV2` / `ActivityHubV2`, add them via
#      `new_sqlite_classes`, swap bindings, leave legacy data behind.
#   2. Keep the existing classes on legacy storage; the DO class code
#      feature-detects `ctx.storage.sql` and falls back to legacy KV.
# Path (2) is wired today via the runtime guard inside
# `src/durable_objects/trace_hub.ts` — both code paths exist, the legacy
# branch runs in prod, the SQLite branch lights up after rename.

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

[env.production.observability.traces]
enabled = true
head_sampling_rate = 0.1

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "d4f48d52fbe14ccd884ea6dd368568ba"

[[env.production.kv_namespaces]]
binding = "PROMPT_STORE"
id = "5ab9b9509a0741f5a76a6f5c97d7c709"

[[env.production.d1_databases]]
binding = "DB"
database_name = "project-sites-db-production"
database_id = "ea3e839a-c641-4861-ae30-dfc63bff8032"

# Cloudflare Flagship — native feature-flag service (OpenFeature, edge-evaluated).
# STANDARD per the feature-flags rule. Uncomment + set app_id once the Flagship app is
# created at dash.cloudflare.com (Feature Flags — public beta; app creation is dashboard-
# only, no API). Then `node scripts/sync-flags-to-flagship.mjs --push` loads all 66 flags.
# Code is ready: getFeatureEvaluationProvider prefers env.FLAGSHIP, falls back to D1 (dark
# until bound). See middleware/feature-evaluation.ts. https://developers.cloudflare.com/flagship/
# [[env.production.flagship]]
# binding = "FLAGSHIP"
# app_id = "<FLAGSHIP_APP_ID>"

[[env.production.r2_buckets]]
binding = "SITES_BUCKET"
bucket_name = "project-sites-production"

# Workers for Platforms: user-uploaded AI endpoints (kind='worker') are
# dispatched into this namespace. Created automatically by Part 2 setup.
#
# DISABLED 2026-06-24: this CF account does NOT have Workers-for-Platforms /
# dispatch-namespace access — `wrangler deploy --env production` hard-fails with
# `code 10121: You do not have access to dispatch namespaces`, which had been
# blocking EVERY production deploy (staging has no WfP binding, so it deployed
# fine). The code already treats USER_DISPATCH as optional: `isWfpConfigured()`
# returns false and the dispatch handler returns 503 "USER_DISPATCH binding
# missing" when the binding is absent (services/wfp_dispatch.ts), so the WfP
# user-endpoints feature degrades cleanly.
# RE-ENABLED 2026-06-24: Workers for Platforms is now on the account and the
# dispatch namespace `project-sites-endpoints` exists (id 6ea19ae4-f28b-4d05-
# a50e-4461b3126c20), so the binding is restored (it had 10121'd while WfP was
# off). isWfpConfigured() now resolves true → user-uploaded AI endpoints dispatch.
[[env.production.dispatch_namespaces]]
binding = "USER_DISPATCH"
namespace = "project-sites-endpoints"

# ─── Real-time collaborative editing (feature: collab_editing) — INERT ────────
# CollabRoomDO (PartyServer + Yjs) backs `GET /api/sites/:id/collab`. The Worker
# code ships LIVE (route + DO class + flag), but the BINDING + MIGRATION below
# stay COMMENTED — same WATCHED ONE-WAY-DOOR hazard as EVENT_DISPATCHER /
# INNGEST_CONTAINER above: activating a NEW Durable Object class REQUIRES an
# active migration; a wrong tag (this worker's DO migration history has errored
# on 10074/10064/10061) BLOCKS ALL DEPLOYS and cannot be dry-run-verified. While
# commented, `routes/collab.ts` returns 503 ("COLLAB_ROOM binding missing") and
# the `collab_editing` flag is OFF, so the feature is safe-but-inert.
#
# To enable (eyes-on watched deploy, Docker up):
#   (1) confirm `v_collab_room` is NOT already in remote history
#       (`wrangler deployments list`).
#   (2) uncomment BOTH blocks below.
#   (3) `wrangler deploy --env production` — watch the migration apply.
#   (4) flip the `collab_editing` flag on (D1 flag_overrides global) and verify a
#       WS handshake to `/api/sites/:id/collab` returns 101 Switching Protocols.
# [[env.production.durable_objects.bindings]]
# name = "COLLAB_ROOM"
# class_name = "CollabRoomDO"
#
# [[env.production.migrations]]
# tag = "v_collab_room"
# new_sqlite_classes = ["CollabRoomDO"]

# Cron triggers:
#   * * * * *    — Pulse Social due-post sweep (every minute, capped 25/run)
#   */5 * * * *  — drain the event_bus outbox → Tinybird + Hatchet (outbox_dispatch.drainOutbox)
#   */30 * * * * — verify hostnames + unstick stuck builds
#   0 * * * *    — Drive re-sync + Pulse Social hourly analytics poll
#   0 14 * * 1   — Mon 14:00 UTC (9 AM ET) weekly summary digest emails (#96)
#   0 6 * * *    — daily snapshot metrics backfill (any snapshot <7d old missing metrics)
[env.production.triggers]
crons = ["* * * * *", "*/5 * * * *", "*/30 * * * *", "0 * * * *", "0 14 * * 1", "0 6 * * *"]

# Uncomment when Queues is enabled on the Cloudflare account
# [[env.production.queues.producers]]
# binding = "QUEUE"
