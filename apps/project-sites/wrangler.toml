# ─── Observability ───────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# ─── KV Namespace for caching ────────────────────────────────
[[kv_namespaces]]
binding = "CACHE_KV"
id = "dc6e00fd0de94cc3afc2c6c774347312"

# ─── KV for prompt hotfixes (optional override of bundled prompts) ─
[[kv_namespaces]]
binding = "PROMPT_STORE"
id = "c74012c6439e403487ece3f66b6f1362"

# ─── D1 Database ─────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "project-sites-db"
database_id = "f5b59818-c785-4807-8aca-282c9037c58c"

# ─── R2 Bucket for static site output ────────────────────────
[[r2_buckets]]
binding = "SITES_BUCKET"
bucket_name = "project-sites"

# ─── Queue producer for workflow jobs ─────────────────────────
# Uncomment when Queues is enabled on the Cloudflare account
# [[queues.producers]]
# binding = "QUEUE"
# queue = "project-sites-workflow"

# ─── Queue consumer ──────────────────────────────────────────
# [[queues.consumers]]
# queue = "project-sites-workflow"
# max_batch_size = 10
# max_retries = 3

# ─── Cloudflare Workflow for AI site generation ────────────────
[[workflows]]
name = "site-generation-workflow"
binding = "SITE_WORKFLOW"
class_name = "SiteGenerationWorkflow"

# ─── Pulse Social — per-post publish workflow (dev binding) ────
[[workflows]]
name = "social-publish-workflow"
binding = "SOCIAL_PUBLISH_WORKFLOW"
class_name = "SocialPublishWorkflow"

# ─── AI binding for Cloudflare Workers AI ─────────────────────
[ai]
binding = "AI"

# Browser Rendering (Playwright on Workers, no Docker). Powers E2E checks and screenshot QA.
[browser]
binding = "BROWSER"

# Vectorize index for RAG (semantic search). 768-dim cosine. Create with: `npx wrangler vectorize create projectsites-rag --dimensions=768 --metric=cosine` + metadata indexes for kind + orgId.
[[vectorize]]
binding = "RAG_INDEX"
index_name = "projectsites-rag"

# ─── AutoRAG (optional). Pre-create the knowledge source via the dash:
#     https://dash.cloudflare.com/?to=/:account/ai/ai-search and bind here.
#     Leave commented until the source is provisioned — `rag.ts` gracefully
#     falls back to `semanticSearch` + Llama synthesis when AUTORAG is unbound.
# [ai_search]
# binding = "AUTORAG"
# name = "projectsites-knowledge"

# ─── Native Rate Limiting (local dev / wrangler dev) ─────────
# Atomic, per-colo, free. Guards POST /oauth/register + POST /oauth/token
# against burst abuse that the eventually-consistent KV counter misses.
# namespace_id "2001" is a local-dev placeholder; CF assigns the real one
# on first production deploy. period MUST be 10 or 60 (no other values).
[[unsafe.bindings]]
name = "OAUTH_RATELIMIT"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 15, period = 10 }

# Stage 4.2 — default per-IP rate-limit for user Functions dispatch, keyed
# `<siteId>:<ip>` in functions_dispatch.ts. 100 req / 60s per IP per site
# (tunable per plan). namespace_id "2002" is a local-dev placeholder; CF assigns
# the real one on first production deploy. period MUST be 10 or 60.
[[unsafe.bindings]]
name = "FUNCTIONS_RATELIMIT"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 100, period = 60 }

# ─── Production ──────────────────────────────────────────────
[env.production]
name = "project-sites"
workers_dev = true
routes = [
  { pattern = "projectsites.dev", custom_domain = true },
  { pattern = "*.projectsites.dev/*", zone_name = "projectsites.dev" },
  # ── Cloud-hosted SaaS subdomain landing pages (returns 200 landing, not 404) ──
  { pattern = "analytics.projectsites.dev", zone_name = "projectsites.dev" },
  { pattern = "logs.projectsites.dev", zone_name = "projectsites.dev" },
  { pattern = "webhooks.projectsites.dev", zone_name = "projectsites.dev" },
  { pattern = "links.projectsites.dev", zone_name = "projectsites.dev" }
]

[env.production.vars]
ENVIRONMENT = "production"
INTERNAL_CALLBACK_URL = "https://project-sites.manhattan.workers.dev/api/internal/build-status"
# Cloudflare auto-config (Part 2 of the admin overhaul brief). CF_API_TOKEN
# is a secret; CF_ACCOUNT_ID + WFP_NAMESPACE_NAME stay in vars because
# they're not sensitive and the dispatch binding below pins this namespace.
CF_ACCOUNT_ID = "84fa0d1b16ff8086dd958c468ce7fd59"
WFP_NAMESPACE_NAME = "project-sites-endpoints"
# Payload CMS instances serve at the branded {slug}.cms.projectsites.dev via WfP dispatch
# (cert-ready *.cms ACM pack). The platform serves the SHARED /_next/* static assets from
# R2 (payload-bundle/assets/) so the dispatched, styled admin works. Flip to "false" to fall
# back to the standalone workers.dev host. See docs/PAYLOAD-CF-LAUNCHER-PROGRESS.md.
PAYLOAD_BRANDED_HOST = "true"
# Shared KV namespace for user Functions (Stage 4.1(b) env.KV). The generated
# worker gets a `kv_namespace` binding to THIS id; the runtime shim prefixes
# every key `site:<siteId>:` so a site can only reach its OWN keys (tenant
# isolation, never a raw namespace). Non-sensitive (a namespace id) → a var.
FUNCTIONS_KV_ID = "4cb559cb6d544cbd8be7c46da11f576b"
# Platform R2 bucket for user Functions (Stage 4.1(c) env.R2). The generated
# worker gets an `r2_bucket` binding to THIS bucket; the runtime shim prefixes
# every object key `sites-data/<siteId>/` so a site can only reach its OWN
# objects (never the raw bucket). Reuses the prod site bucket (prefix-isolated).
FUNCTIONS_R2_BUCKET = "project-sites-production"
# Platform worker NAME the Functions runtime shims call via a SERVICE binding
# (env.AI → /api/_ps/ai/run; env.DATA next) — in-process worker→worker, NOT a
# public URL (a WfP user script fetching the platform's own workers.dev reenters
# the account + 522s). Paired with the FUNCTIONS_INTERNAL_SECRET worker secret
# that signs/verifies the per-site token. Non-sensitive (a worker name).
FUNCTIONS_INTERNAL_SERVICE = "project-sites"
# Novu workflow trigger identifier for `ps-notify` (the dashboard notification
# bell backbone). Novu auto-suffixes identifiers on creation, so the real value
# lives here rather than a hardcoded literal. Non-sensitive (a trigger id).
NOVU_WORKFLOW_ID = "ps-notify-eiz1pyxe"
# Route every external LLM call through Cloudflare AI Gateway when "true"
# (universal cache + fallback + rate-limit + structured logs + cost
# attribution). Set to "false" to bypass during incident response. Requires
# AI Gateway named "projectsites" provisioned at:
#   https://dash.cloudflare.com/?to=/:account/ai/ai-gateway
AI_GATEWAY_ENABLED = "true"
# Unified Analytics ingestion beacon (Plane H). When "true", served sites inject
# the tracker → POST /api/events → durable analytics_events D1 store → the admin
# Analytics tab. Dark-launched OFF; flip to "true" + redeploy to go live (a normal
# deploy — independent of the gated EVENT_DISPATCHER DO migration, which adds
# external Sentry/PostHog/GA4/GTM fan-out on top).
ANALYTICS_INGEST_ENABLED = "false"
# Sentry release tracking (item #48). Override per deploy with
#   wrangler deploy --env production --var SENTRY_RELEASE:$(git rev-parse --short HEAD)
# so the version matches the sourcemaps uploaded by
# scripts/upload-sentry-sourcemaps.mjs. The placeholder below keeps the
# binding present even on hand-rolled deploys.
SENTRY_RELEASE = "project-sites@dev"
# ── Native Social — platform OAuth credentials (SOCIAL-102/106) ──────
# Each pair is optional — MissingAppCredsError → 501 gracefully when unset.
# Provision via: wrangler secret put TIKTOK_CLIENT_SECRET --env production
# TIKTOK_CLIENT_ID = ""
# TIKTOK_CLIENT_SECRET = ""
# YOUTUBE_CLIENT_ID = ""
# YOUTUBE_CLIENT_SECRET = ""
# PINTEREST_CLIENT_ID = ""
# PINTEREST_CLIENT_SECRET = ""
# GBP_CLIENT_ID = ""
# GBP_CLIENT_SECRET = ""
# NEXTDOOR_CLIENT_ID = ""
# NEXTDOOR_CLIENT_SECRET = ""

[[env.production.workflows]]
name = "site-generation-workflow-production"
binding = "SITE_WORKFLOW"
class_name = "SiteGenerationWorkflow"
# Workflow instances do NOT inherit the Worker's Durable Object bindings —
# the build step needs SITE_BUILDER explicitly listed or env.SITE_BUILDER is
# undefined inside the workflow (the 'container not configured' error).
bindings = ["SITE_BUILDER"]

# Workflows v2: resumable Google Drive ingest pipeline (item #60).
# Replaces the inline syncDriveFolder + hourly cron synchronous path.
[[env.production.workflows]]
name = "drive-sync-workflow-production"
binding = "DRIVE_SYNC_WORKFLOW"
class_name = "DriveSyncWorkflow"

# Workflows v2: resumable AI image generation with DALL-E → Stability
# fallback (item #60). Replaces the synchronous generateSectionImage path
# inside the build pipeline.
[[env.production.workflows]]
name = "image-generation-workflow-production"
binding = "IMAGE_GENERATION_WORKFLOW"
class_name = "ImageGenerationWorkflow"

# Workflows v2: snapshot quality matrix capture (screenshot + composition +
# SEO + a11y). Auto-fired off `POST /api/sites/:id/snapshots` and manually
# via `POST /api/sites/:siteId/snapshots/:snapshotId/capture`.
[[env.production.workflows]]
name = "snapshot-quality-workflow-production"
binding = "SNAPSHOT_QUALITY_WORKFLOW"
class_name = "SnapshotQualityWorkflow"

# Pulse Social — fans out per-account publishes for one pulse_posts row.
# Fired by the every-minute due-post sweep cron in src/index.ts.
[[env.production.workflows]]
name = "social-publish-workflow-production"
binding = "SOCIAL_PUBLISH_WORKFLOW"
class_name = "SocialPublishWorkflow"

[env.production.ai]
binding = "AI"

[env.production.browser]
binding = "BROWSER"

# Per-environment Vectorize binding (RAG). See top-level [[vectorize]] block
# for index creation steps.
[[env.production.vectorize]]
binding = "RAG_INDEX"
index_name = "projectsites-rag"

# Workers Analytics Engine — admin dashboard visit tracker.
# Powers the Analytics page (queried via the SQL API).
# RE-ENABLED 2026-06-24: Analytics Engine was turned on for the account, so the
# binding is restored (it had been commented while the account lacked the feature
# — CF error 10089). `cf_analytics` no-ops when the binding is absent, so this is
# purely additive. Writes are still gated by ANALYTICS_INGEST_ENABLED ("false").
[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "projectsites_admin_v1"

# Claude Code build container — custom image with Claude Code + skills + template pre-baked
# standard-4 = 4 vCPU, 12 GiB RAM, 8 GB disk. Larger size accelerates parallel prompt execution.
# RESTORED 2026-08-19 — 655ccf2c commented this out while adding the catalog plane; it broke
# EVERY AI site build (workflow throws 'SITE_BUILDER container not configured'). The builder is
# the core product pipeline — never folds into a catalog-plane sweep.
[[env.production.containers]]
class_name = "SiteBuilderContainer"
image = "./Dockerfile"
# 20 — the journey's repeated builds + a few concurrent customers must never
# exhaust the pool (hit live 2026-08-19 at 10; the stop-on-terminal release +
# 90m sleepAfter backstop the actual running count, but warm instances inside
# their sleep window still hold slots).
max_instances = 20
# Right-sized 2026-08-20: standard-4 (12 GiB) → standard-1 (4 GiB) — the build
# container rarely needs 12 GiB and provisioned-memory billing made the warm
# pool ~$124/mo. 4 GiB still clears Claude Code + npm/vite builds; pool cap stays
# 20 for scale (raise toward hundreds only when concurrent customers justify it).
instance_type = "standard-1"

[[env.production.durable_objects.bindings]]
name = "SITE_BUILDER"
class_name = "SiteBuilderContainer"
#
## AppRuntimeContainer — base "coming soon" placeholder. Catalog apps that
## don't yet have a dedicated per-image DO subclass route here and surface
## the friendly interstitial defined in `containers/app-runtime/Dockerfile`.
## Per-image subclasses + their `[[containers]]` blocks below own the real
## upstream images for the top-10 supported apps.
#[[env.production.containers]]
#class_name = "AppRuntimeContainer"
#image = "./containers/app-runtime/Dockerfile"
#max_instances = 50
#instance_type = "basic"






