name: Run the Loop

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      objective:
        description: Optional focus for this one loop
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  loop:
    uses: heymegabyte/agent-skills/.github/workflows/run-the-loop.yml@7c2206d032a803bb8012e495ff4a010cd5ed985f
    with:
      project: heymegabyte/projectsites.dev
      shared-revision: 7c2206d032a803bb8012e495ff4a010cd5ed985f
      runner-labels: '["self-hosted","linux","ubuntu","persistent","proxmox-vm","agent","codex"]'
      objective: ${{ inputs.objective || '' }}
