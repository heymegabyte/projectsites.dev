name: Run the Loop

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      runtime:
        description: Official native CLI route
        type: choice
        options: [codex, claude, deepseek]
        default: codex
      objective:
        description: Optional focus for this one loop
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  loop:
    uses: heymegabyte/agent-skills/.github/workflows/run-the-loop.yml@1b470770b58a8dcafbb7a46b802e85bef914590d
    with:
      runtime: ${{ inputs.runtime || 'codex' }}
      project: heymegabyte/projectsites.dev
      shared-revision: 1b470770b58a8dcafbb7a46b802e85bef914590d
      runner-labels: '["self-hosted","linux","ubuntu","persistent","proxmox-vm","agent","codex"]'
      objective: ${{ inputs.objective || '' }}
