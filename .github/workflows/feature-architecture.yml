name: Feature Architecture Validation

# Ensures feature modules, manifests, and flag registry stay in sync.
# Blocks merge on any hard-error drift (EXIT 1). Warnings are surfaced
# in the job log but do not block.
#
# Runs on every push — fast (< 30 s, pure Node 22 regex/fs, no build step).

on:
  push:
    branches: ['**']
    paths:
      - 'apps/project-sites/src/**'
      - 'apps/project-sites/libs/**'
      - 'apps/project-sites/frontend/src/app/**'
      - 'apps/project-sites/e2e/**'
      - 'apps/project-sites/frontend/e2e/**'
      - 'apps/project-sites/scripts/validate-*.mjs'
      - 'apps/project-sites/scripts/check-*.mjs'
      - 'apps/project-sites/scripts/validate-e2e-inventory.mjs'
      - 'apps/project-sites/frontend/scripts/validate-e2e-inventory.mjs'
      - 'apps/project-sites/package.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/project-sites/src/**'
      - 'apps/project-sites/libs/**'
      - 'apps/project-sites/frontend/src/app/**'
      - 'apps/project-sites/e2e/**'
      - 'apps/project-sites/frontend/e2e/**'
      - 'apps/project-sites/scripts/validate-*.mjs'
      - 'apps/project-sites/scripts/check-*.mjs'
      - 'apps/project-sites/scripts/validate-e2e-inventory.mjs'
      - 'apps/project-sites/frontend/scripts/validate-e2e-inventory.mjs'
      - 'apps/project-sites/package.json'
  # Allow manual trigger at any time
  workflow_dispatch:

concurrency:
  group: feature-arch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Feature Architecture — manifest + drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No npm install needed — scripts use only Node built-ins

      - name: Install shared package (for typecheck step)
        working-directory: packages/shared
        run: npm ci --legacy-peer-deps
        continue-on-error: true   # shared not required for the drift scripts

      - name: Install worker deps (for typecheck step)
        working-directory: apps/project-sites
        run: npm ci --legacy-peer-deps
        continue-on-error: true   # deps not required for the drift scripts

      # ── Step 1: Validate manifest shapes + flag cross-check ──────────────
      - name: Validate feature manifests
        id: manifests
        working-directory: apps/project-sites
        run: node scripts/validate-feature-manifests.mjs

      # ── Step 2: Detect architecture drift (HARD GATE) ────────────────────
      # --strict promotes warnings (orphan _fortress dirs, impl-without-flag
      # handlers) to errors. We landed --strict here after the 2026-05-28
      # close-the-loop wave dropped warnings to 0 — keeping the gate honest
      # so any new drift fails CI immediately rather than accruing.
      - name: Detect feature drift
        id: drift
        working-directory: apps/project-sites
        run: node scripts/validate-feature-drift.mjs --strict

      # ── Step 2b: Validate e2e inventories (every spec mapped in COVERAGE.yml) ─
      # Fails on orphan specs / dangling refs so the feature→test inventory
      # can't silently drift (worker e2e + Angular frontend e2e). Pure Node.
      - name: Validate worker e2e inventory
        id: worker_e2e_inventory
        working-directory: apps/project-sites
        run: node scripts/validate-e2e-inventory.mjs

      - name: Validate frontend e2e inventory
        id: frontend_e2e_inventory
        working-directory: apps/project-sites/frontend
        run: node scripts/validate-e2e-inventory.mjs

      # ── Step 2c: Architecture fitness — exclude-list gate (§15, HARD GATE) ─
      # Fails CI if a §4-excluded vendor (Polar/Trigger.dev/Postmark/Clay/
      # Socket.dev/Chainguard) reappears in src/+libs/. Resend is tracked-
      # migration (ADR-0019) → non-blocking until its burndown completes. Pure
      # Node, no deps. Promotes the local `npm run check:fitness:ci` to a CI gate.
      - name: Architecture fitness (exclude-list)
        id: fitness
        working-directory: apps/project-sites
        run: node scripts/check-architecture-fitness.mjs --ci

      # IDOR ownership-gate detector — every `:siteId`/`:id` feature handler must
      # carry an ownership check (caps the 2026-06-28 cross-tenant audit arc; 9 gaps
      # fixed). 0-finding-stable → graduated straight to a blocking gate.
      - name: IDOR ownership gate
        working-directory: apps/project-sites
        run: node scripts/check-idor-gates.mjs --ci

      # Hardcoded super-admin-email detector — every admin/whitelist CHECK must go
      # through isSuperAdmin() or the shared org-owner whitelist helper, never a fresh
      # email literal (caps the 2026-08-14 convergence arc: iters 9 + 11 fixed 3
      # divergent hardcodes — token_burn_meter admin gate wrongly 404'd hey@, and
      # build_budget/build_limits duplicated the unlimited-compute whitelist).
      # 0-finding-stable after the fixes → ships as a blocking gate. Pure Node, no deps.
      - name: Hardcoded admin-email gate
        working-directory: apps/project-sites
        run: node scripts/check-hardcoded-admin-email.mjs --ci

      # Local-error-helper gate — every feature handler must import unauthorized/notFound
      # from src/lib/feature_guard.ts, never re-define them locally (caps iter 15: 12
      # modules re-defined identical local helpers that drifted from the canonical
      # envelope — missing request_id, referral_loop diverged 'Authentication required'
      # vs 'Auth required'). 0-finding-stable after the consolidation → blocking gate.
      - name: Local error-helper gate
        working-directory: apps/project-sites
        run: node scripts/check-local-error-helpers.mjs --ci

      # Unwired-endpoint detector — every FE `/api/*` call must resolve to a
      # registered worker route (caps the 2026-08-02 admin-verification arc:
      # P0.20 `PATCH /api/admin/profile` + P0.21 `GET/PUT /api/voice/mcp-attachments`
      # were FE calls to routes that did not exist → "Save failed" 404s). Scans
      # 623 worker route shapes vs every FE call; 0-finding-stable at arc close →
      # graduated straight to a blocking gate. Pure Node, no deps.
      - name: Unwired-endpoint gate
        working-directory: apps/project-sites
        run: node scripts/check-unwired-endpoints.mjs --ci

      # Orphan-flag-gate detector — every flag key gated by isFlagOn()/requireFlag()
      # in worker src MUST exist in FLAG_REGISTRY (registry.ts). A gate on a flag that
      # was pruned/un-flagged out of the registry returns false forever → the route
      # 404s permanently + the feature is un-toggleable, masked by graceful "not enabled"
      # UI. Caps the 2026-08-16 arc: public_api (fixed), then approval_workflow +
      # github_repo_sync + abandoned_build_nudge + research_cache (over-pruned, re-added)
      # + site_mcp_server (retired, dead route deleted). 0-finding-stable → blocking gate.
      - name: Orphan-flag-gate detector
        working-directory: apps/project-sites
        run: node scripts/check-orphan-flag-gates.mjs

      # Admin-contract drift gate — cross-checks the admin section SSOT
      # (e2e/admin-verify/admin-contract.mjs) against the live Angular route tree
      # (frontend/src/app/app.routes.ts) + the label map. Fails on UNCOVERED (a live
      # /admin/* component route with no contract row → ships with zero convergence
      # coverage: the exact "routed+mounted ≠ reachable" / "advertised-orphan" drift the
      # contract exists to kill), STALE (row points at a dead route), or ALIAS_DRIFT (an
      # alias row's redirect vanished). The script's own docstring mandated "wire into CI
      # + lefthook" but it had never been wired anywhere — the SSOT could silently drift.
      # 0-finding-stable (46 routes ⇄ 44 rows, verified red-on-injected-drift) → blocking
      # gate. Pure Node, no deps. Mirrors npm run check:admin-contract.
      - name: Admin-contract drift gate
        working-directory: apps/project-sites
        run: node scripts/validate-admin-contract.mjs

      # Three sibling drift gates that shipped with unit tests (test:scripts) + npm
      # scripts but were never wired into any gate chain — the exact same orphaned-gate
      # class as the admin-contract gate above (found by the same-class sweep the turn
      # admin-contract was wired). Each is 0-finding-stable, caps a real incident arc,
      # and now blocks CI. Pure Node, no deps. Mirror npm run check:{status-sweep,
      # system-org-seed,trialing-drift}.
      #   • status-sweep    — every status sweep with a terminal write has a grace/retry
      #     guard (caps premature-terminal-status-strands-rows).
      #   • system-org-seed — every 'system' sentinel FK call-site has a seeded system org.
      #   • trialing-drift  — no active-only plan gate excludes trialing subs (entitlement).
      - name: Status-sweep no-retry gate
        working-directory: apps/project-sites
        run: node scripts/check-status-sweep-no-retry.mjs

      - name: System-org sentinel-seed gate
        working-directory: apps/project-sites
        run: node scripts/check-system-org-seed.mjs

      - name: Trialing-entitlement drift gate
        working-directory: apps/project-sites
        run: node scripts/check-trialing-drift.mjs

      # Unchecked-dbInsert ingestion gate — every dbInsert() into a user-generated
      # INGESTION table (contacts / form_submissions / donations / orders / voice_* /
      # pulse_posts / leads …) MUST capture the returned `{ error }` and surface it,
      # never a bare `await`. A bare await silently drops the row + returns a lying-200
      # (the 2026-08-06 contact-form incident: visitors' submissions accepted then
      # lost, invisible in /admin/forms). Drained to 0 HIGH (worker 1d98d418) + stable;
      # gates HIGH-only (a precise curated ingestion-table list) so it fires ONLY on a
      # NEW ingestion caller that forgets the check — never on the ~78 best-effort/
      # bookkeeping writes. Pure Node, no deps. (Promotes check:dbinsert:ci from the
      # advisory `npm run check` variant per audit-arc-maturity-ladder Detect→Gate.)
      - name: Unchecked-dbInsert ingestion gate
        working-directory: apps/project-sites
        run: node scripts/check-unchecked-dbinsert.mjs --ci

      # HTML-injection gate — no unescaped user-data interpolation into an HTML sink
      # (innerHTML / template-string → served HTML). Guards stored/reflected XSS on
      # generated + admin surfaces. Exits 1 on any finding; 0 now. Pure Node, no deps.
      - name: HTML-injection gate
        working-directory: apps/project-sites
        run: node scripts/check-html-injection.mjs

      # Fabricated-people gate — no invented person + testimonial/quote on a shippable
      # surface without a _confirmations.json entry (anti-fabrication / trust mandate;
      # Storybook *.stories.ts demo data excluded). Just caught the site-kit
      # testimonials-grid shipping 3 fake DEFAULT testimonials (fixed same commit).
      # Exits 1 on any finding; 0 now. Pure Node, no deps.
      - name: Fabricated-people gate
        working-directory: apps/project-sites
        run: node scripts/validate-no-fabricated-people.mjs

      # Fabricated-kit-defaults gate — a site-kit primitive (frontend/src/app/site-kit/*)
      # must default its array @Input()s to [] (empty → self-hide via *ngIf), never a
      # populated demo array. A populated default ships fabricated prices/menus/listings/
      # FAQs/testimonials/features/stats VERBATIM to a real business's generated site the
      # moment the consumer forgets to pass real data — a silent trust violation that
      # passes every render gate. Drained to 0 (21 kit components fixed same fire) + a
      # precise, low-false-positive detector (populated array @Input() default; empty []
      # + scalar labels pass; *.stories.ts excluded) → gates on --ci. Companion to the
      # fabricated-people gate (which catches the person+quote sub-class). Pure Node.
      - name: Fabricated-kit-defaults gate
        working-directory: apps/project-sites
        run: node scripts/check-fabricated-kit-defaults.mjs --ci

      # ── Step 3: Upload drift report as artifact (always, even on failure) ─
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_id }}
          path: apps/project-sites/_drift-report.json
          retention-days: 14
          if-no-files-found: ignore

      # ── Step 4: TypeScript type check (separate job gate) ─────────────────
      - name: TypeScript type check
        id: typecheck
        working-directory: apps/project-sites
        run: npx tsc --noEmit
        continue-on-error: false

      # ── Step 5: Annotate PR on failure ────────────────────────────────────
      - name: Annotate failures
        if: failure()
        run: |
          echo "::error title=Feature Architecture Validation Failed::One or more feature architecture checks failed."
          echo "::error ::Run 'npm run validate:features' locally to see the full report."
          echo "::error ::Fix all hard errors before merging. Warnings are advisory."
          if [ -f apps/project-sites/_drift-report.json ]; then
            echo "Drift report summary:"
            node -e "
              const r = JSON.parse(require('fs').readFileSync('apps/project-sites/_drift-report.json','utf8'));
              const errors = r.violations.filter(v=>v.severity==='error');
              const warns  = r.violations.filter(v=>v.severity==='warn');
              console.log('  Errors  :', errors.length);
              console.log('  Warnings:', warns.length);
              errors.forEach(v => console.log('  ✖', v.message));
            "
          fi
