name: storybook

# Builds + deploys the component workshop to storybook.projectsites.dev
# (Cloudflare Pages project: projectsites-storybook) on every merge to main that
# touches the frontend. Storybook is the single source of truth for the
# storybook → template → generator pipeline.

on:
  push:
    branches: [main]
    paths:
      - 'apps/project-sites/frontend/**'
      - '.github/workflows/storybook.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/project-sites/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/project-sites/frontend/package-lock.json

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare Pages
        # The scoped CLOUDFLARE_API_TOKEN lacks Pages:Edit → Cloudflare API auth
        # error 10000 (deploy failed on every run). Deploy with the GLOBAL key
        # (Pages-capable) via wrangler's env-var auth — the identical pattern the
        # Worker + R2 deploys use in project-sites.yaml. Runs in the job's default
        # working-directory (apps/project-sites/frontend). --yes auto-installs
        # wrangler (a bare `npx wrangler` prompted + cancelled on the old run).
        run: npx --yes wrangler@4 pages deploy storybook-static --project-name=projectsites-storybook --branch=main
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
