name: Prod E2E (Playwright against live projectsites.dev)

# Runs the real-login-against-prod Playwright suite (playwright.prod.config.ts →
# helpers/auth.ts Pathway C via E2E_API_KEY) so admin regressions are caught on the
# LIVE site, not just in unit tests. Gated on the E2E_API_KEY secret being present:
# when it's unset (forks, secret-less runs) the suite step is SKIPPED, never failed —
# the conditional-ci-gates fail-open pattern. Closes audit #50's prod-E2E-in-CI half.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/project-sites/src/**'
      - 'apps/project-sites/e2e/**'
      - 'apps/project-sites/playwright.prod.config.ts'
      - 'apps/project-sites/frontend/e2e/**'
      - 'apps/project-sites/frontend/playwright.prod.config.ts'
      # Self-test workflow edits (the Browserbase jobs stay push-excluded via their `if`).
      - '.github/workflows/prod-e2e.yml'
  schedule:
    # Daily smoke against prod at 07:13 UTC (off the :00 mark).
    - cron: '13 7 * * *'

env:
  NODE_VERSION: '22'

# Concurrency is EVENT-SCOPED (not ref-only). A newer PUSH cancels an older in-flight
# PUSH run (the convergence cron pushes often → the latest commit's run must go green,
# no pile-up), BUT schedule (nightly) and workflow_dispatch runs get their OWN groups so
# a cron push CANNOT cancel them. This fixes the gate NEVER once completing: with a
# ref-only group, a ~07:20 UTC cron push cancelled the 07:13 nightly EVERY day (every
# scheduled run 2026-08-03→08-07 was `cancelled`, and the gate has zero `success` runs
# ever), so the tarpit fix + the Browserbase brian sweep never produced a real green/red
# signal. Now the nightly + any on-demand dispatch run to completion as the authoritative
# signal, while push runs still supersede each other.
concurrency:
  group: prod-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod-e2e:
    name: Playwright @ prod (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # 30 (not 20): the sharded run's slowest shard clocked ~17-20 min and shard 1 was
    # CANCELLED at the 20-min ceiling on the first sharded cert (run 31196899625). The
    # 10-min margin lets a slow-under-load shard finish instead of cancelling mid-suite.
    timeout-minutes: 30
    # The prod suite (~1030 tests) tarpits the LIVE rate-limited edge under CONCURRENCY: the
    # isolated prod-e2e-signin job (1-2 concurrent) passes, but 4-way × default-2-workers
    # (4 concurrent from 2 IPs) leaked ~5 rotating timeout-class fails EVERY run even with
    # retries:3 — a perpetually-red gate gets ignored (conditional-ci-gates). Fix: --workers=1
    # (1 request/IP — see the run step) + max-parallel:2 = only 2 concurrent AGGREGATE, below
    # the tarpit threshold; 8 shards (~130 tests each) keep each serial shard ~15-18 min, well
    # under the 30-min timeout. fail-fast:false so one shard's failure still lets the others
    # report; each shard uploads its own report artifact.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Presence gate: secrets can't be used in job-level `if:`, so check here and
      # gate the suite step on the output. Absent secret → skip, not fail.
      - name: Check E2E_API_KEY is configured
        id: gate
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
        run: |
          if [ -n "$E2E_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_API_KEY secret not set — skipping prod E2E (fail-open)."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.has_key == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/project-sites/package-lock.json

      - name: Install deps
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install Playwright Chromium
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites
        run: npx playwright install --with-deps chromium

      - name: Run prod E2E suite
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          PROD_URL: https://projectsites.dev
        run: npm run test:e2e:prod -- --shard=${{ matrix.shard }}/8 --workers=1

      - name: Upload Playwright report
        if: steps.gate.outputs.has_key == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-prod-report-shard-${{ matrix.shard }}
          path: apps/project-sites/playwright-report/
          retention-days: 7

  # Frontend admin prod suite (apps/project-sites/frontend/e2e/*.e2e.ts) — the
  # a11y / reflow / contrast / campaign-generator gates that ran ONLY manually
  # before. Same fail-open E2E_API_KEY gate as the worker job above. Closes the
  # frontend CLAUDE.md "Known gap" (prod suite not wired into any CI workflow).
  prod-e2e-frontend:
    name: Playwright @ prod (frontend admin, shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # Sharded 8-ways (matching the backend prod-e2e job above). The 734-test frontend
    # *.e2e.ts suite ran as ONE unsharded job and hit timeout-minutes at test ~182/734
    # EVERY nightly (08-03→08-08 all `cancelled`); a cancelled job rolls the WHOLE run up
    # to `cancelled` (cancelled outranks failure/success), masking the backend shards' real
    # verdict. Sharding makes each ~92-test shard finish well under the timeout so the
    # frontend cert actually completes + reports green/red instead of perpetual `cancelled`.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check E2E_API_KEY is configured
        id: gate
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
        run: |
          if [ -n "$E2E_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_API_KEY secret not set — skipping frontend prod E2E (fail-open)."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.has_key == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/project-sites/frontend/package-lock.json

      - name: Install deps
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites/frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites/frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend prod E2E suite
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites/frontend
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          PROD_URL: https://projectsites.dev
        run: npm run test:e2e:prod -- --shard=${{ matrix.shard }}/8 --workers=1

      - name: Upload Playwright report
        if: steps.gate.outputs.has_key == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-prod-report-frontend-shard-${{ matrix.shard }}
          path: apps/project-sites/frontend/playwright-report/
          retention-days: 7

  # Sign-in real-credentials suite (signin-real-chrome.e2e.ts) — authenticates
  # as brian@megabyte.space via POST /api/auth/test-login with E2E_TEST_PASSWORD,
  # then verifies /admin loads with zero console errors. Gated on E2E_TEST_PASSWORD
  # being present: when unset the step SKIPS (fail-open).
  prod-e2e-signin:
    name: Playwright sign-in (real credentials) @ prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check E2E_TEST_PASSWORD is configured
        id: gate
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          if [ -n "$E2E_TEST_PASSWORD" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_TEST_PASSWORD secret not set — skipping sign-in E2E (fail-open)."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.has_key == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/project-sites/frontend/package-lock.json

      - name: Install deps
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites/frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites/frontend
        run: npx playwright install --with-deps chromium

      - name: Run sign-in E2E (real credentials)
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites/frontend
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          PROD_URL: https://projectsites.dev
        run: |
          npx playwright test --config=playwright.prod.config.ts \
            e2e/signin-green.e2e.ts e2e/signin-real-chrome.e2e.ts

      - name: Upload Playwright report
        if: steps.gate.outputs.has_key == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-signin-report
          path: apps/project-sites/frontend/playwright-report/
          retention-days: 7

  # Browserbase real-Chrome VISUAL sweep of all 20 admin sections — the mandate
  # "every admin feature WORKS + is POPULATED with real data, verified via REAL
  # BROWSER technically AND visually" (Brian 2026-08-02). Real Chrome (no device
  # emulation) renders deep section content headless Playwright can't; per section
  # it asserts render + a per-section REAL-DATA signal + 0 console errors +
  # 0 CRITICAL axe + a full-page screenshot artifact. Burns ONE billed Browserbase
  # session (~8 min) so it runs ONLY on the nightly schedule + manual dispatch,
  # NEVER per-push. Triple-gated fail-open: E2E_API_KEY + BROWSERBASE_API_KEY +
  # BROWSERBASE_PROJECT_ID all present, else the run step SKIPS (never fails).
  prod-visual-browserbase:
    name: Browserbase real-Chrome visual sweep @ prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A Browserbase session is billed — nightly + manual only, never on push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Browserbase + E2E secrets are configured
        id: gate
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
        run: |
          if [ -n "$E2E_API_KEY" ] && [ -n "$BROWSERBASE_API_KEY" ] && [ -n "$BROWSERBASE_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Browserbase/E2E secrets not all set — skipping visual sweep (fail-open)."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/project-sites/package-lock.json

      - name: Install deps
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/project-sites
        run: npm ci --legacy-peer-deps --ignore-scripts

      # The sweep drives a REMOTE Browserbase Chrome via connectOverCDP; a local
      # Chromium is only a safety net for the Playwright runner's project resolver.
      - name: Install Playwright Chromium
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/project-sites
        run: npx playwright install --with-deps chromium

      - name: Run Browserbase visual sweep
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/project-sites
        env:
          RUN_BROWSERBASE: '1'
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          PROD_URL: https://projectsites.dev
        run: |
          npx playwright test --config=playwright.prod.config.ts \
            browserbase/admin-section-sweep --workers=1

      - name: Upload section screenshots + report
        if: steps.gate.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browserbase-visual-sweep
          path: |
            apps/project-sites/e2e/screenshots/browserbase/
            apps/project-sites/playwright-report/
          retention-days: 14

  # Browserbase real-Chrome sweep AS brian@megabyte.space — the mandate's CONTINUOUS
  # verification that every admin section is POPULATED WITH BRIAN'S REAL DATA (not just
  # the e2e-org's, which is cross-org-scoped and proves render/data-domain only, NOT
  # brian's account — see e2e/browserbase/admin-section-sweep-brian.spec.ts header +
  # memory [[e2e-key-is-not-brians-account]]). Real login via /api/auth/test-login, then
  # sweeps all 23 sections (22 shared + operator-only) asserting brian's real data +
  # 0 console errors + 0 CRITICAL axe + a per-section screenshot. Burns ONE billed
  # session (~15 min) — nightly + manual only, never per-push. QUAD-gated fail-open:
  # E2E_API_KEY + BROWSERBASE_API_KEY + BROWSERBASE_PROJECT_ID + E2E_TEST_PASSWORD (the
  # brian test-login) all present, else the run step SKIPS (never fails).
  prod-visual-browserbase-brian:
    name: Browserbase real-Chrome sweep AS brian @ prod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Browserbase + E2E + brian-login secrets are configured
        id: gate
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          if [ -n "$E2E_API_KEY" ] && [ -n "$BROWSERBASE_API_KEY" ] && [ -n "$BROWSERBASE_PROJECT_ID" ] && [ -n "$E2E_TEST_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Browserbase/E2E/brian-login secrets not all set — skipping brian sweep (fail-open)."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/project-sites/package-lock.json

      - name: Install deps
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/project-sites
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install Playwright Chromium
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/project-sites
        run: npx playwright install --with-deps chromium

      - name: Run Browserbase sweep AS brian
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/project-sites
        env:
          RUN_BROWSERBASE: '1'
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          PROD_URL: https://projectsites.dev
        run: |
          npx playwright test --config=playwright.prod.config.ts \
            browserbase/admin-section-sweep-brian --workers=1

      - name: Upload brian section screenshots + report
        if: steps.gate.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browserbase-visual-sweep-brian
          path: |
            apps/project-sites/e2e/screenshots/browserbase/
            apps/project-sites/playwright-report/
          retention-days: 14

  # Fast headless a11y + health guards against LIVE prod — the loop-authored probes
  # (public-a11y-probe: axe WCAG 2.2 AA over the public funnel × 6 breakpoints;
  # admin-surf-audit: axe + console + error-boundary + content over all 25 admin
  # sections). Both are settle-hardened (wait for skeletons/[aria-busy] to clear before
  # axe) so they don't flake on load transients. The public probe needs NO secret (public
  # surface); the admin surf is E2E_API_KEY-gated fail-open. Runs on every push (probe
  # edits live under e2e/**), nightly, + dispatch — cheap (~15 min, no Browserbase billing).
  prod-a11y-guards:
    name: A11y guards @ prod (public funnel + admin surf)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/project-sites/package-lock.json

      # The probes' createRequire('../../frontend/') resolves node_modules from
      # apps/project-sites/ (dirname of that path), NOT frontend/ — so install the WORKER
      # deps (which carry playwright + @axe-core/playwright), matching the prod-e2e worker
      # job. (Installing only frontend deps → "Cannot find module 'playwright'" in CI.)
      - name: Install deps
        working-directory: apps/project-sites
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install Playwright Chromium
        working-directory: apps/project-sites
        run: npx playwright install --with-deps chromium

      # Public funnel a11y — no secret needed (public prod surface).
      - name: Public funnel a11y (axe WCAG 2.2 AA × 6 breakpoints)
        working-directory: apps/project-sites
        run: node e2e/loop-eval/public-a11y-probe.mjs

      # Homepage LCP — guards the prerendered-hero fast paint (fails only if the shell
      # <h1> regresses); tracks the known SPA-hydration re-render gap via ::notice. Public.
      - name: Homepage LCP guard (prerendered-hero paint)
        working-directory: apps/project-sites
        run: node e2e/loop-eval/homepage-lcp-probe.mjs

      # Admin surf needs the authed session — fail-open when the secret is absent.
      - name: Check E2E_API_KEY is configured
        id: gate
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
        run: |
          if [ -n "$E2E_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_API_KEY secret not set — skipping admin surf (fail-open)."
          fi

      - name: Admin surf audit (a11y+console+boundary+content, mobile + desktop)
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
        run: |
          VIEWPORT=390 node e2e/admin-verify/admin-surf-audit.mjs
          VIEWPORT=1280 node e2e/admin-verify/admin-surf-audit.mjs

      # Truthful-persistence: reconcile /api/sites display vs the D1 ground-truth count
      # (lying-empty / silent-cap detector). Reads D1 via wrangler → needs the CF secrets
      # too; the probe fail-opens (exit 0) when any of them is unset.
      - name: Reconcile /api/sites display vs D1 (truthful-persistence)
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: node e2e/admin-verify/reconcile-e2e-sites.mjs

      # Continuous health of the SERVED generated sites (catches post-build/stale rot no
      # build-time eval sees — stale SW, bad app.js deploy, pre-stub-guard content-stubs).
      # Samples 10 spread newest→oldest; the `published` filter excludes rebuilding sites.
      - name: Generated-site health sweep (served sites)
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
        run: node e2e/loop-eval/generated-site-health-sweep.mjs 10

      # WCAG 2.2 AA (axe) on the SERVED product sites — the marketing a11y probe never
      # covered the paid sites (ADA/EAA gap). Tracking (::notice, never red): the template
      # contrast fix (2bb30da) clears each site only on its next rebuild.
      - name: Generated-site a11y sweep (axe WCAG 2.2 AA — tracking)
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
        run: node e2e/loop-eval/generated-site-a11y-probe.mjs 5

  # The admin-verify SUITE as one scheduled gate — `npm run admin:verify` (run-all.mjs):
  # surf ×2 → reconcile-surfaces → every verify-*-causal (globbed, auto-joins new probes) →
  # billing-checkout mount → editor data/functions tabs. The causal + billing + editor
  # probes run ONLY when the /admin INTEGRITY loop fires manually otherwise — this is their
  # scheduled backstop (the loop's cron auto-expires after 7 days). Schedule + dispatch ONLY
  # (the full suite is ~25 min of Browserbase — never per-push; excluded via the job `if`).
  # Fail-open on E2E_API_KEY; each Browserbase probe self-skips when its own creds are unset,
  # so a partial-secret env stays green (SKIP≠FAIL). Surf overlaps prod-a11y-guards by design
  # — run-all runs the loop's exact suite as one cohesive, glob-auto-including unit.
  admin-verify-suite:
    name: Admin-verify suite (npm run admin:verify @ prod)
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check E2E_API_KEY is configured
        id: gate
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
        run: |
          if [ -n "$E2E_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_API_KEY secret not set — skipping admin-verify suite (fail-open)."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.has_key == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/project-sites/package-lock.json

      # createRequire('../../frontend/') in the probes resolves node_modules from
      # apps/project-sites/ (dirname of that path) — install the WORKER deps (they carry
      # playwright + @axe-core/playwright), matching prod-a11y-guards above.
      - name: Install deps
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install Playwright Chromium
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites
        run: npx playwright install --with-deps chromium

      - name: Run admin-verify suite (surf + reconcile + causal + billing + editor)
        if: steps.gate.outputs.has_key == 'true'
        working-directory: apps/project-sites
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          PROD_URL: https://projectsites.dev
          # verify-funnel-reconcile.mjs needs D1 ground truth (`wrangler d1` COUNT of
          # published sites) + the super-admin funnel API (via FUNNEL_BASE=workers.dev,
          # which dodges the prod-domain bot challenge on the authed admin endpoint).
          # Without these it self-skips; with them the funnel display==store + outbox
          # dead-letter guard (AL-052/053) runs as a nightly backstop. Read-only queries.
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          FUNNEL_BASE: https://project-sites.manhattan.workers.dev
        run: npm run admin:verify
