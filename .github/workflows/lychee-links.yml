name: Lychee Link Check (report-only)

# Report-only (non-blocking) broken-link surface for the worker's docs + markdown
# + served HTML references. always.md mandates "all hyperlinks valid"; nothing
# checked them in CI. Surfaces dead links in the Actions log WITHOUT failing the
# build (external link flakiness must not block merges). Detect→Surface rung of
# the audit-arc maturity ladder; promote to blocking once the link surface is clean.
# Ledger: 50-improvement-audit follow-on — "30 brilliant tools" #8.
on:
  push:
    branches: [main]
    paths:
      - 'apps/project-sites/**/*.md'
      - 'apps/project-sites/docs/**'
      - 'apps/project-sites/public/**/*.html'
  pull_request:
    branches: [main]
    paths:
      - 'apps/project-sites/**/*.md'
      - 'apps/project-sites/docs/**'
      - 'apps/project-sites/public/**/*.html'
  workflow_dispatch:

jobs:
  links:
    name: lychee (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Non-blocking: external links flake; this surfaces dead refs without
      # failing the build. --no-progress keeps the log clean; caches reduce rate-limits.
      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        continue-on-error: true
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --exclude-mail
            'apps/project-sites/docs/**/*.md'
            'apps/project-sites/public/**/*.html'
          fail: false
